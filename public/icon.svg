<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Central 4-point Gemini star -->
    <path d="M 0 -130 Q 0 0 -130 0 Q 0 0 0 130 Q 0 0 130 0 Q 0 0 0 -130 Z" fill="url(#sparkGrad)" />
    <!-- Secondary small sparkle -->
    <path d="M 90 -90 Q 90 -50 50 -50 Q 90 -50 90 -10 Q 90 -50 130 -50 Q 90 -50 90 -90 Z" fill="#67e8f9" opacity="0.9" />
    <!-- Mini accent dots -->
    <circle cx="-75" cy="85" r="9" fill="#e0e7ff" opacity="0.85" />
    <circle cx="85" cy="80" r="7" fill="#a5b4fc" opacity="0.75" />
  </g>
</svg>
